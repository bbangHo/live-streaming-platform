# 로컬 실행용 web(nginx): 페이지 + /api → 백엔드 + /live/ → MediaMTX(WHIP·HLS) 를 한 출처(localhost:8000)로 묶는다.
# (HTTPS 프로필은 Caddyfile이 같은 역할)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 내부 전용(MediaMTX → 백엔드 송출 인증). 밖에서는 막는다
    location /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WHIP 송출 / WHEP 시청 (WebRTC 시그널링) → 같은 출처라 CORS 없이 Authorization 헤더를 보낼 수 있다
    location ~ ^/live/[^/]+/(whip|whep)(/.*)?$ {
        proxy_pass http://mediamtx:8889;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /live/ {
        proxy_pass http://mediamtx:8888;
    }
}
