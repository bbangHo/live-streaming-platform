# MediaMTX 설정. 여기 없는 키는 MediaMTX 기본값을 쓴다.
# 브라우저 → WHIP(:8889) → MediaMTX → LL-HLS(:8888) → hls.js
# docker compose에서는 환경변수(MTX_*)로 송출 인증·API 주소를 덮어쓴다 → compose.yml 참고

logLevel: info

# 이번 스파이크에서 안 쓰는 입출력은 끈다 (포트 충돌·노출 줄이기)
rtsp: no
rtmp: no
srt: no
moq: no

# Control API: 백엔드가 송출 중인 경로를 조회하고(방송 상태 동기화) 종료된 방송의 송출을 끊는다.
# 단독 실행은 로컬에서만 연다. compose는 MTX_APIADDRESS=:9997 (내부망에만, 호스트로는 안 엶)
api: yes
apiAddress: 127.0.0.1:9997

# 송출 인증. 단독 실행(바이너리)은 기본값 internal = 누구나 송출(개발용).
# compose는 MTX_AUTHMETHOD=http 로 바꿔, 송출(publish)마다 백엔드에 묻는다: 그 방송 소유자의 로그인 토큰(Bearer)이어야 허용.
# 시청(read)·API는 묻지 않는다 (시청은 공개, API 포트는 내부망 전용)
authHTTPExclude:
  - action: read
  - action: playback
  - action: api
  - action: metrics
  - action: pprof

# WebRTC: WHIP 수신(송출) + WHEP(저지연 시청). 둘 다 :8889
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']   # shortcut: 스파이크라 전부 허용, 배포 땐 서비스 도메인으로 좁힌다
webrtcLocalUDPAddress: :8189

# HLS 시청 출력. lowLatency = LL-HLS (fMP4 + partial segment)
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAlwaysRemux: yes          # 첫 시청자도 바로 재생되게 송출 시작부터 HLS 생성

# 녹화 재생 서버: /get?path=live/<키>&start=<시각>&duration=<초>&format=mp4 → mp4 한 파일로 내려준다.
# nginx·Caddy가 /playback/ 으로 넘긴다. 재생(playback)은 시청과 같이 공개(authHTTPExclude)
playback: yes
playbackAddress: :9996
playbackAllowOrigins: ['*']

pathDefaults:
  # 같은 방송에 두 번째 송출이 들어오면 거부한다 (기본값은 나중 것이 앞의 송출을 밀어냄)
  overridePublisher: no

  # 녹화(선택 기능): 송출되는 모든 방송을 fMP4로 저장. 송출이 끊기거나 1시간마다 파일(세그먼트)이 하나씩 완성된다.
  # 파일 이름 = 세그먼트 시작 시각(UTC) → 백엔드가 파싱해 재생 주소를 만든다. 자동 삭제 안 함(0s)
  # compose는 MTX_PATHDEFAULTS_RECORDPATH로 /recordings 볼륨에 쓰고, 완성될 때 record-hook.sh로 백엔드에 위치를 알린다
  record: yes
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f%z
  recordFormat: fmp4
  recordSegmentDuration: 1h
  recordDeleteAfter: 0s

# 경로: live/<스트림 키>. 다른 경로는 받지 않는다
paths:
  "~^live/[A-Za-z0-9_-]+$":
