spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:livestream}
    username: ${DB_USER:livestream}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)가 만든다
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true    # 4xx 응답 본문을 RFC 9457 ProblemDetail(JSON)로

app:
  jwt:
    # 비어 있으면 기동할 때마다 임의 키를 만든다(재시작하면 기존 access token 무효). 운영은 .env로 고정
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:14d}
