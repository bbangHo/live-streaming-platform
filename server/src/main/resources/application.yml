spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:livestream}
    username: ${DB_USER:livestream}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)가 만든다
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true    # 4xx 응답 본문을 RFC 9457 ProblemDetail(JSON)로

app:
  jwt:
    # 비어 있으면 기동할 때마다 임의 키를 만든다(재시작하면 기존 access token 무효). 운영은 .env로 고정
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:14d}
  media:
    api-url: ${MEDIAMTX_API_URL:http://localhost:9997}
    # MediaMTX authHTTPAddress의 ?secret= 값과 같아야 한다. 비면 송출 인증을 전부 거부
    hook-secret: ${MEDIA_HOOK_SECRET:}
    # DB에 없는 스트림 키로도 송출 허용(개발용 dev-publish.html). 배포 시 false
    dev-bypass: ${STREAM_DEV_BYPASS:false}
    grace: ${STREAM_GRACE:30s}
    sync-enabled: ${STREAM_SYNC_ENABLED:true}
