# 전체 스택 로컬 실행: docker compose up -d  →  http://localhost:8000/publish.html
# (HTTPS가 필요할 때만: docker compose --profile https up -d  →  https://<DOMAIN>/publish.html)
services:
  mediamtx:
    # -ffmpeg 변형 = Alpine 기반이라 녹화 완료 훅(record-hook.sh)에서 sh·wget을 쓸 수 있다
    image: bluenviron/mediamtx:1.21.3-ffmpeg
    restart: unless-stopped
    volumes:
      - ./media/mediamtx.yml:/mediamtx.yml:ro
      - ./media/record-hook.sh:/record-hook.sh:ro
      - recordings:/recordings          # 녹화 파일. 컨테이너를 지워도 남는다 (down -v만 삭제)
    environment:
      # 브라우저에 알려 줄 WebRTC(ICE) 주소. 같은 PC면 127.0.0.1, 다른 기기에서 붙으면 PC의 LAN IP
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_HOST:-127.0.0.1}
      MTX_WEBRTCLOCALTCPADDRESS: :8189   # UDP가 막힌 망용 TCP 대체 경로
      # 송출 인증: 송출마다 백엔드에 "이 토큰이 이 방송 소유자인가?"를 묻는다 (StreamAuthController)
      MTX_AUTHMETHOD: http
      MTX_AUTHHTTPADDRESS: http://backend:8080/api/internal/media/auth?secret=${MEDIA_HOOK_SECRET:-local-media-hook-secret}
      MTX_APIADDRESS: :9997              # 백엔드가 상태 동기화에 쓴다. ports에 없으니 호스트·외부에서는 못 붙음
      # 녹화: 볼륨에 저장하고, 파일이 완성되면 백엔드에 위치·길이를 알린다 (RecordingService)
      MTX_PATHDEFAULTS_RECORDPATH: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f%z
      MTX_PATHDEFAULTS_RUNONRECORDSEGMENTCOMPLETE: sh /record-hook.sh
      RECORD_HOOK_URL: http://backend:8080/api/internal/media/recordings?secret=${MEDIA_HOOK_SECRET:-local-media-hook-secret}
    ports:
      - "8888:8888"        # HLS 시청
      - "8889:8889"        # WHIP 송출 / WHEP
      - "8189:8189/udp"    # WebRTC 미디어
      - "8189:8189/tcp"

  # 백엔드 API (Spring Boot): 인증/인가 + 방송 정보. http://localhost:8080/api/...
  backend:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-livestream}
      DB_USER: ${POSTGRES_USER:-livestream}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-livestream-local}
      JWT_SECRET: ${JWT_SECRET:-}   # 비우면 기동마다 임의 키(재시작 시 재로그인). 배포 시 .env에 32자 이상
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_PLAYBACK_URL: http://mediamtx:9996
      MEDIA_HOOK_SECRET: ${MEDIA_HOOK_SECRET:-local-media-hook-secret}   # MediaMTX와 같은 값. 배포 시 .env로 바꾼다
      # 등록 안 된 스트림 키(dev-publish.html의 test 등)로도 송출 허용. 로컬 개발용 — 배포 시 .env에 false
      STREAM_DEV_BYPASS: ${STREAM_DEV_BYPASS:-true}
    ports:
      - "${API_PORT:-8080}:8080"

  # DB: 방송·계정 영구 저장. 데이터는 pgdata 볼륨에 남아 컨테이너를 지우거나 재시작해도 유지된다(down -v 만 삭제)
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-livestream}
      POSTGRES_USER: ${POSTGRES_USER:-livestream}
      # 기본값은 로컬 전용(포트를 호스트에 열지 않음). 배포 시 .env로 바꾼다
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livestream-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend, mediamtx]   # nginx는 기동 때 upstream 이름을 찾으므로 먼저 떠 있어야 함
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./media/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8000}:80"

  # 선택: HTTPS (모바일 기기에서 송출하거나 공인 도메인에 올릴 때). 페이지·WHIP·HLS를 한 출처로 묶는다
  caddy:
    image: caddy:2.10-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [mediamtx, backend]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "443:443"
      - "443:443/udp"
      - "80:80"
    volumes:
      - ./media/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data

volumes:
  caddy_data:
  pgdata:
  recordings:
