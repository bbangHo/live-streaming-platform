<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다시보기</title>
<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
</head>
<body>
<nav id="nav"></nav>
<main>
  <div id="player"></div>
  <h1 id="title"></h1>
  <p class="row muted"><span id="meta"></span><a id="broadcast-link">방송 페이지</a></p>
  <dl class="card info">
    <dt>녹화 시작</dt><dd id="started"></dd>
    <dt>길이</dt><dd id="duration"></dd>
    <dt>저장 위치</dt><dd><code id="file"></code></dd>
  </dl>
  <!-- 방송 소유자에게만 보인다. 권한은 서버가 다시 확인한다(타인 403) -->
  <p id="manage" hidden><button id="delete" class="danger">녹화 삭제</button></p>
  <p class="error" id="error"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get('id');

async function load(me) {
  try {
    const r = await api(`/api/recordings/${encodeURIComponent(id)}`);
    document.title = `다시보기 · ${r.broadcastTitle ?? ''}`;
    // MediaMTX playback 서버가 녹화 파일을 mp4로 내려준다 → <video>가 그대로 재생·탐색
    $('player').replaceChildren(el('video', { src: r.playbackPath, controls: true, playsInline: true, preload: 'metadata' }));
    $('title').textContent = r.broadcastTitle ?? '(삭제된 방송)';
    $('meta').textContent = `방송자 ${r.ownerUsername ?? '알 수 없음'} · `;
    $('broadcast-link').href = `broadcast.html?id=${r.broadcastId}`;
    $('started').textContent = new Date(r.startedAt).toLocaleString();
    $('duration').textContent = formatDuration(r.durationMs);
    $('file').textContent = r.filePath;
    $('manage').hidden = !(me && me.id === r.ownerId);
  } catch (err) { $('error').textContent = err.status === 404 ? '없는 녹화입니다.' : err.message; }
}

$('delete').onclick = async () => {
  if (!confirm('이 녹화를 삭제할까요? 파일도 지워지고 되돌릴 수 없습니다.')) return;
  try { await api(`/api/recordings/${id}`, { method: 'DELETE' }); location.href = 'recordings.html'; }
  catch (err) { $('error').textContent = err.message; }
};

renderNav().then(load);
</script>
</body>
</html>
