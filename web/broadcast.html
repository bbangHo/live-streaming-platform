<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방송</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<script src="app.js"></script>
</head>
<body>
<nav id="nav"></nav>
<main>
  <div id="player"></div>
  <h1 id="title"></h1>
  <p class="row"><span id="status"></span><span id="owner" class="muted"></span></p>
  <p id="description" style="white-space: pre-wrap"></p>
  <p class="error" id="error"></p>

  <section id="donations" class="card">
    <h2>후원 <span id="donation-total" class="accent"></span> <span id="donation-count" class="muted"></span></h2>
    <ul id="donation-list" class="plain"></ul>
    <form id="donation-form" hidden>
      <div class="row">
        <button type="button" data-amount="1000">1,000원</button>
        <button type="button" data-amount="5000">5,000원</button>
        <button type="button" data-amount="10000">10,000원</button>
        <input name="amount" type="number" min="1000" max="1000000" step="100" value="1000" required style="width: 9em"> 원
      </div>
      <div class="row nowrap">
        <input name="message" maxlength="200" placeholder="응원 메시지 (선택)" autocomplete="off">
        <button class="primary">후원하기</button>
      </div>
      <p class="muted" id="donation-mode"></p>
    </form>
    <p id="donation-login" class="muted" hidden><a id="donation-login-link">로그인</a>하면 후원할 수 있습니다.</p>
    <p class="error" id="donation-error"></p>
  </section>

  <section id="recordings" class="card" hidden>
    <h2>다시보기</h2>
    <ul id="recording-list" class="plain"></ul>
  </section>

  <section id="comments" class="card">
    <h2>댓글 <span id="comment-count" class="muted"></span></h2>
    <ul id="comment-list" class="comments"></ul>
    <form id="comment-form" hidden>
      <div class="row nowrap">
        <input name="content" maxlength="500" placeholder="댓글 쓰기 (500자까지)" required autocomplete="off">
        <button class="primary">등록</button>
      </div>
    </form>
    <p id="comment-login" class="muted" hidden><a id="comment-login-link">로그인</a>하면 댓글을 쓸 수 있습니다.</p>
    <p class="error" id="comment-error"></p>
  </section>

  <!-- 소유자에게만 보인다. 버튼을 숨기는 건 편의일 뿐, 권한은 서버가 매 요청마다 다시 확인한다(타인 403) -->
  <section id="manage" class="card" hidden>
    <h2>방송 관리</h2>
    <p class="muted">송출을 시작하면 자동으로 「방송 중」이 되고, 송출이 끊긴 채 30초가 지나면 「종료」됩니다.</p>
    <div class="row">
      <a id="publish-pc" class="button primary">PC 화면 송출</a>
      <a id="publish-mobile" class="button primary">모바일 카메라 송출</a>
      <button id="stop">방송 종료</button>
      <button id="delete" class="danger">삭제</button>
    </div>
    <p class="muted">스트림 키 <code id="stream-key"></code> (시청 주소에 쓰이는 공개 값 — 송출은 소유자 로그인이 있어야만 됩니다)</p>
    <form id="edit" style="margin-top: 12px">
      <input name="title" maxlength="100" required>
      <textarea name="description" maxlength="1000" rows="3" placeholder="설명 (선택)"></textarea>
      <div><button>수정 저장</button></div>
    </form>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get('id');
let me = null, current = null, hls = null;

function showError(err) { $('error').textContent = err.message; }

/** 방송 중이면 HLS 재생, 아니면 안내 문구. 상태가 바뀔 때만 다시 그린다. */
function renderPlayer(b) {
  if (current?.status === b.status && current?.hlsPath === b.hlsPath) return;
  hls?.destroy(); hls = null;
  if (b.status !== 'LIVE') {
    $('player').replaceChildren(el('div', { className: 'placeholder' }, b.status === 'READY' ? '방송 시작 전입니다' : '종료된 방송입니다'));
    return;
  }
  const video = el('video', { controls: true, autoplay: true, muted: true, playsInline: true });
  $('player').replaceChildren(video);
  const src = location.origin + b.hlsPath;
  if (window.Hls && Hls.isSupported()) {
    const play = () => {
      hls = new Hls({ lowLatencyMode: true });
      // 상태는 LIVE인데 아직 송출 영상이 안 들어왔으면 404 → 3초 뒤 다시
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { hls.destroy(); setTimeout(play, 3000); } });
      hls.loadSource(src);
      hls.attachMedia(video);
    };
    play();
  } else {
    video.src = src; // Safari(iOS) 네이티브 HLS
  }
}

function render(b) {
  renderPlayer(b);
  current = b;
  document.title = b.title;
  $('title').textContent = b.title;
  $('status').replaceChildren(statusBadge(b.status));
  $('owner').textContent = `방송자 ${b.ownerUsername ?? '알 수 없음'}`;
  $('description').textContent = b.description ?? '';

  const mine = me && me.id === b.ownerId;
  $('manage').hidden = !mine;
  if (!mine) return;
  $('stream-key').textContent = b.streamKey;
  $('publish-pc').href = `publish-pc.html?id=${b.id}`;
  $('publish-mobile').href = `publish-mobile.html?id=${b.id}`;
  for (const a of [$('publish-pc'), $('publish-mobile')]) a.hidden = b.status === 'ENDED';
  $('stop').disabled = b.status !== 'LIVE';
  const form = $('edit');
  if (document.activeElement?.form !== form) { // 입력 중인 값은 덮어쓰지 않는다
    form.elements.title.value = b.title; // form.title은 폼 자신의 title 속성이라 elements로
    form.elements.description.value = b.description ?? '';
  }
}

/** 이 방송의 녹화 파일들 (방송 중에도 끊겼다 다시 붙었으면 앞부분이 있다) */
async function loadRecordings() {
  try {
    const list = await api(`/api/broadcasts/${encodeURIComponent(id)}/recordings`);
    $('recordings').hidden = list.length === 0;
    $('recording-list').replaceChildren(...list.map((r, i) => el('li', {},
      el('a', { href: `recording.html?id=${r.id}` }, `▶ 녹화 ${i + 1}`),
      el('span', { className: 'muted' }, ` ${new Date(r.startedAt).toLocaleString()} · ${formatDuration(r.durationMs)}`))));
  } catch { /* 방송이 없으면 위의 오류 표시로 충분 */ }
}

async function load() {
  try {
    const b = await api(`/api/broadcasts/${encodeURIComponent(id)}`);
    if (current && current.status !== b.status) loadRecordings(); // 방송이 끝나면 곧 녹화가 생긴다
    render(b); $('error').textContent = '';
  }
  catch (err) { showError(err.status === 404 ? new Error('없는 방송입니다.') : err); }
}

const act = (fn) => async () => { try { render(await fn()); } catch (err) { showError(err); } };
$('stop').onclick = () => confirm('방송을 종료할까요? 송출 중이면 송출도 끊깁니다.') && act(() => api(`/api/broadcasts/${id}/stop`, { method: 'POST' }))();
$('edit').onsubmit = (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  act(() => api(`/api/broadcasts/${id}`, { method: 'PATCH', body: { title: f.get('title'), description: f.get('description') || null } }))();
};
$('delete').onclick = async () => {
  if (!confirm('이 방송을 삭제할까요? 되돌릴 수 없습니다.')) return;
  try { await api(`/api/broadcasts/${id}`, { method: 'DELETE' }); location.href = 'index.html'; } catch (err) { showError(err); }
};

// ── 댓글: 조회는 누구나, 작성은 로그인, 수정·삭제는 작성자 본인 (버튼은 편의 — 서버가 다시 확인해 403) ──
let comments = [], editingId = null;

function renderComments() {
  $('comment-count').textContent = comments.length ? `${comments.length}개` : '';
  const open = document.querySelector('#comment-list .editing'); // 다시 그려도(3초마다) 고치던 내용 유지
  const editingValue = open && Number(open.dataset.id) === editingId ? open.elements[0].value : undefined;
  $('comment-list').replaceChildren(...comments.map((c) => {
    const mine = me && me.id === c.authorId;
    const meta = el('span', { className: 'muted' }, ` ${new Date(c.createdAt).toLocaleTimeString()}${c.updatedAt ? ' (수정됨)' : ''}`);
    if (mine && editingId === c.id) {
      const input = el('input', { value: editingValue ?? c.content, maxLength: 500, required: true });
      const form = el('form', { className: 'row nowrap editing' }, input,
        el('button', { className: 'primary' }, '저장'),
        el('button', { type: 'button', onclick: () => { editingId = null; renderComments(); } }, '취소'));
      form.dataset.id = c.id;
      form.onsubmit = (e) => { e.preventDefault(); commentAct(() => api(`/api/comments/${c.id}`, { method: 'PATCH', body: { content: input.value } })); editingId = null; };
      return el('li', {}, form);
    }
    return el('li', {},
      el('b', {}, c.authorUsername ?? '알 수 없음'), meta,
      mine ? el('span', { className: 'actions' },
        el('button', { className: 'link', onclick: () => { editingId = c.id; renderComments(); document.querySelector('#comment-list .editing input')?.focus(); } }, '수정'),
        el('button', { className: 'link', onclick: () => confirm('댓글을 삭제할까요?') && commentAct(() => api(`/api/comments/${c.id}`, { method: 'DELETE' })) }, '삭제'))
        : null,
      el('div', { className: 'content' }, c.content));
  }));
}

async function loadComments() {
  try {
    const list = await api(`/api/broadcasts/${encodeURIComponent(id)}/comments`);
    const atBottom = $('comment-list').scrollHeight - $('comment-list').scrollTop - $('comment-list').clientHeight < 40;
    const grew = list.length > comments.length;
    comments = list;
    renderComments();
    if (grew && atBottom) $('comment-list').scrollTop = $('comment-list').scrollHeight; // 새 댓글이 오면 아래로 (위를 읽는 중이면 그대로)
  } catch { /* 방송이 없으면 위의 오류 표시로 충분 */ }
}

async function commentAct(fn) {
  $('comment-error').textContent = '';
  try { await fn(); } catch (err) { $('comment-error').textContent = err.message; }
  await loadComments();
}

$('comment-form').onsubmit = (e) => {
  e.preventDefault();
  const input = e.target.elements.content;
  commentAct(async () => { await api(`/api/broadcasts/${id}/comments`, { method: 'POST', body: { content: input.value } }); input.value = ''; })
    .then(() => { $('comment-list').scrollTop = $('comment-list').scrollHeight; });
};

// ── 후원: 합계·최근 후원은 누구나. 결제 승인·적립은 서버만 한다(donate-result.html → /api/donations/confirm) ──
const won = (n) => `${Number(n).toLocaleString('ko-KR')}원`;

async function loadDonations() {
  try {
    const s = await api(`/api/broadcasts/${encodeURIComponent(id)}/donations`);
    $('donation-total').textContent = s.total ? won(s.total) : '';
    $('donation-count').textContent = s.count ? `${s.count}건` : '';
    $('donation-list').replaceChildren(...s.recent.map((d) => el('li', {},
      el('b', {}, d.donorUsername ?? '알 수 없음'), ` ${won(d.amount)}`,
      d.message ? el('span', { className: 'muted' }, ` — ${d.message}`) : null)));
  } catch { /* 방송이 없으면 위의 오류 표시로 충분 */ }
}

document.querySelectorAll('#donation-form [data-amount]').forEach((b) => b.onclick = () => {
  $('donation-form').elements.amount.value = b.dataset.amount;
});

$('donation-form').onsubmit = async (e) => {
  e.preventDefault();
  $('donation-error').textContent = '';
  const f = e.target.elements;
  try {
    // 1) 서버에 주문을 만든다 — 금액은 서버가 기억하고, 승인 때 다시 대조한다
    const order = await api(`/api/broadcasts/${id}/donations`, { method: 'POST', body: { amount: Number(f.amount.value), message: f.message.value || null } });
    const back = new URL('donate-result.html', location.href);
    back.searchParams.set('broadcast', id);
    // 2) 결제창: 토스 키가 있으면 토스페이먼츠(테스트) 결제창, 없으면 내장 테스트 결제창
    if (order.provider === 'toss') {
      await loadScript('https://js.tosspayments.com/v2/standard');
      const payment = TossPayments(order.clientKey).payment({ customerKey: TossPayments.ANONYMOUS });
      await payment.requestPayment({
        method: 'CARD', amount: { currency: 'KRW', value: order.amount },
        orderId: order.orderId, orderName: order.orderName,
        successUrl: back.href, failUrl: back.href,
      });
    } else {
      const checkout = new URL('test-checkout.html', location.href);
      for (const [k, v] of Object.entries({ orderId: order.orderId, amount: order.amount, orderName: order.orderName, back: back.href })) checkout.searchParams.set(k, v);
      location.href = checkout.href;
    }
  } catch (err) { $('donation-error').textContent = err.message; }
};

function loadScript(src) {
  return new Promise((ok, fail) => document.head.append(el('script', { src, onload: ok, onerror: () => fail(new Error('결제 모듈을 불러오지 못했습니다')) })));
}

renderNav().then((u) => {
  me = u;
  $('comment-form').hidden = !me;
  $('comment-login').hidden = !!me;
  $('comment-login-link').href = `login.html?next=${encodeURIComponent('broadcast.html?id=' + id)}`;
  api('/api/payments/config').then((c) => {
    $('donation-mode').textContent = c.provider === 'toss' ? '토스페이먼츠 테스트 결제창으로 이동합니다 (실제 돈이 나가지 않음).'
      : '내장 테스트 결제창으로 이동합니다 (실제 돈이 나가지 않음).';
  }).catch(() => {});
  return Promise.all([load(), loadComments(), loadRecordings(), loadDonations()]).then(() => {
    // 내 방송에는 후원 버튼 대신 합계만
    const mine = me && current && me.id === current.ownerId;
    $('donation-form').hidden = !me || mine;
    $('donation-login').hidden = !!me;
    $('donation-login-link').href = `login.html?next=${encodeURIComponent('broadcast.html?id=' + id)}`;
  });
});
setInterval(load, 5000); // 방송 시작·종료를 시청자 화면에 반영
setInterval(loadComments, 3000);
setInterval(loadDonations, 5000);
setInterval(() => current?.status !== 'READY' && loadRecordings(), 10000);
</script>
</body>
</html>
