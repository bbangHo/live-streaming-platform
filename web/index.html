<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방송 목록</title>
<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
</head>
<body>
<nav id="nav"></nav>
<main>
  <section id="create" class="card" hidden>
    <h2>방송 만들기</h2>
    <form id="create-form">
      <input name="title" placeholder="방송 제목" maxlength="100" required>
      <textarea name="description" placeholder="설명 (선택)" maxlength="1000" rows="2"></textarea>
      <div class="row"><button class="primary">만들기</button><span class="error" id="create-error"></span></div>
    </form>
  </section>

  <div class="tabs">
    <button data-status="" aria-pressed="true">전체</button>
    <button data-status="LIVE" aria-pressed="false">방송 중</button>
  </div>
  <ul id="list" class="grid"></ul>
  <p id="empty" class="muted" hidden>방송이 없습니다.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
let filter = '';

async function load() {
  const list = await api('/api/broadcasts' + (filter ? `?status=${filter}` : ''));
  $('empty').hidden = list.length > 0;
  $('list').replaceChildren(...list.map((b) => el('li', { className: 'card' },
    el('a', { href: `broadcast.html?id=${b.id}` },
      statusBadge(b.status),
      el('h3', {}, b.title),
      el('div', { className: 'muted' }, `${b.ownerUsername ?? '알 수 없음'} · ${new Date(b.createdAt).toLocaleString()}`)))));
}

document.querySelectorAll('.tabs button').forEach((btn) => btn.onclick = () => {
  filter = btn.dataset.status;
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-pressed', b === btn));
  load();
});

$('create-form').onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    const b = await api('/api/broadcasts', { method: 'POST', body: { title: f.get('title'), description: f.get('description') || null } });
    location.href = `broadcast.html?id=${b.id}`;
  } catch (err) { $('create-error').textContent = err.message; }
};

renderNav().then((me) => { $('create').hidden = !me; });
load();
</script>
</body>
</html>
