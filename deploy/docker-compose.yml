# 한 도메인(HTTPS)으로 페이지·WHIP·HLS를 모두 낸다. 사용법은 deploy/README.md
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    volumes:
      - ../media/mediamtx.yml:/mediamtx.yml:ro
    environment:
      # 브라우저에 알려 줄 ICE 주소. 컨테이너 IP 대신 서버 공인 IP/도메인을 넣어야 밖에서 붙는다
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_HOST:?PUBLIC_HOST 필요 (.env 참고)}
      # UDP가 막힌 망(회사·일부 모바일)용 TCP 대체 경로
      MTX_WEBRTCLOCALTCPADDRESS: :8189
      # 같은 출처로만 쓰므로 CORS를 서비스 도메인으로 좁힌다
      MTX_WEBRTCALLOWORIGINS: https://${DOMAIN}
      MTX_HLSALLOWORIGINS: https://${DOMAIN}
    ports:
      - "8189:8189/udp"   # WebRTC 미디어 (방화벽에서 열 것)
      - "8189:8189/tcp"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [mediamtx]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 필요 (.env 참고)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv/web:ro
      - caddy_data:/data   # 인증서 보관. 지우면 재발급(Let's Encrypt 발급 횟수 제한 주의)

volumes:
  caddy_data:
